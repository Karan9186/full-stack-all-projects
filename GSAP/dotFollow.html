<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }
      #main {
        height: 100%;
        width: 100%;
        background-color: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      #dot {
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background-color: white;
        position: fixed;
        z-index: 9;
        text-align: center;
      }
      .image {
        /* background-color: red; */
        height: 30vh;
        width: 20vw;
      }
      .image img {
        /* background-color: red; */
        height: 30vh;
        width: 20vw;
        object-fit: cover;
        position: relative;
      }
      .overlay {
        background-color: transparent;
        height: 30vh;
        width: 20vw;
        position: absolute;
        z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="dot"></div>
    <div id="main">
      <div class="image">
        <div class="overlay"></div>
        <img
          src="https://images.unsplash.com/photo-1718976142386-e9ebe34d3aee?q=80&w=1932&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt=""
        />
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="./dotFollow.js"></script>
  </body>
</html>
