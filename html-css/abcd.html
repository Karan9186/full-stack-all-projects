<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn {
      @apply w-16 h-16 rounded-xl bg-gray-800 text-white text-xl font-semibold hover:bg-gray-700 transition;
    }
    .btn-operator {
      @apply bg-indigo-600 hover:bg-indigo-500;
    }
    .btn-equal {
      @apply bg-green-600 hover:bg-green-500;
    }
    .btn-clear {
      @apply bg-red-600 hover:bg-red-500;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-gray-900 to-gray-800 min-h-screen flex items-center justify-center text-white">
  <div class="bg-gray-900 p-6 rounded-2xl shadow-2xl w-[320px]">
    <h1 class="text-2xl font-bold mb-4 text-center text-indigo-400">Calculator</h1>
    <input id="display" class="w-full bg-black text-right text-3xl p-3 rounded-xl mb-4" disabled />
    
    <div class="grid grid-cols-4 gap-4">
      <!-- Row 1 -->
      <button class="btn btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn" onclick="appendValue('(')">(</button>
      <button class="btn" onclick="appendValue(')')">)</button>
      <button class="btn btn-operator" onclick="appendValue('/')">÷</button>
      
      <!-- Row 2 -->
      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn btn-operator" onclick="appendValue('*')">×</button>
      
      <!-- Row 3 -->
      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn btn-operator" onclick="appendValue('-')">−</button>
      
      <!-- Row 4 -->
      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn btn-operator" onclick="appendValue('+')">+</button>
      
      <!-- Row 5 -->
      <button class="btn col-span-2" onclick="appendValue('0')">0</button>
      <button class="btn" onclick="appendValue('.')">.</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
